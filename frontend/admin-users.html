<!-- ===== TITLE ===== -->

<h2>All Users</h2>

<div style="width:100%; display:flex; justify-content:flex-end; margin-bottom:15px;">

  <button class="report-btn" onclick="downloadUsersPDF()">
    Download Users PDF
  </button>

</div>

<!-- ===== TABLE ===== -->

<table id="usersReport">

  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Created</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="usersTable"></tbody>

</table>

<script>

function loadUsers() {

  fetch("http://vishwpandhariyatrinivas.onrender.com/all-users")

  .then(res => res.json())

  .then(data => {

    let html = "";

    if (!Array.isArray(data) || data.length === 0) {

      html = `
        <tr>
          <td colspan="6">
            No users found
          </td>
        </tr>
      `;

    } else {

      data.forEach(u => {

        const date = u.created_at
        ? new Date(u.created_at).toLocaleString()
        : "N/A";

        html += `
        
        <tr>

          <td>${u.id}</td>

          <td>${u.name}</td>

          <td>${u.email}</td>

          <td>${u.phone || "N/A"}</td>

          <td>${date}</td>

          <td>
            <button 
              class="delete-btn"
              onclick="deleteUser(${u.id})"
            >
              Delete
            </button>
          </td>

        </tr>
        
        `;
      });
    }

    document.getElementById("usersTable").innerHTML = html;

  });

}

function deleteUser(id){

  if(confirm("Delete this user?")){

    fetch("http://vishwpandhariyatrinivas.onrender.com/delete-user/" + id,{
      method:"DELETE"
    })

    .then(res => res.json())

    .then(data => {

      alert("User Deleted");

      loadUsers();

    });

  }

}

loadUsers();

// ================= DOWNLOAD USERS PDF =================

function downloadUsersPDF(){

  const table = document.getElementById("usersReport");

  const cloneTable = table.cloneNode(true);

  // DELETE BUTTON COLUMN REMOVE
  cloneTable.querySelectorAll("tr").forEach(row => {
    if(row.cells.length > 5){
      row.deleteCell(5);
    }
  });

  const element = document.createElement("div");

  element.innerHTML = `
    <h1 style="
      text-align:center;
      color:#ff6f00;
      margin-bottom:20px;
      font-family:Arial;
    ">
      Vishwpandhari Yatrinivas - Users Report
    </h1>
  `;

  element.appendChild(cloneTable);

  const opt = {

    margin:0.5,

    filename:"Users_Report.pdf",

    image:{
      type:"jpeg",
      quality:1
    },

    html2canvas:{
      scale:2
    },

    jsPDF:{
      unit:"in",
      format:"a3",
      orientation:"landscape"
    }

  };

  html2pdf().set(opt).from(element).save();

}

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</body>
