<script>

// ================= SHOW USER =================
// ================= NAVBAR CONTROL =================
// ================= NAVBAR CONTROL =================
// ================= DATE FORMAT =================
function formatDateTime(dateStr) {
  if (!dateStr) return "-";

  const date = new Date(dateStr);
  if (isNaN(date)) return "-";

  return date.toLocaleString("en-IN", {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  });
}

// ================= NAVBAR =================
function updateNavbar() {
  const user = JSON.parse(localStorage.getItem("loggedInUser"));
  const admin = localStorage.getItem("admin");

  const userName = document.getElementById("userName");
  const loginBtn = document.getElementById("loginBtn");
  const registerBtn = document.getElementById("registerBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const bookingNav = document.getElementById("bookingNav");
  const dashboardNav = document.getElementById("dashboardNav");

  if (userName) userName.style.display = "none";
  if (logoutBtn) logoutBtn.style.display = "none";
  if (bookingNav) bookingNav.style.display = "none";
  if (dashboardNav) dashboardNav.style.display = "none";

  if (loginBtn) loginBtn.style.display = "inline";
  if (registerBtn) registerBtn.style.display = "inline";

  if (admin) {
    userName.innerText = "👨‍💼 Admin";
    userName.style.display = "inline";
    logoutBtn.style.display = "inline";
    dashboardNav.style.display = "inline-block";
    loginBtn.style.display = "none";
    registerBtn.style.display = "none";
  } 
  else if (user) {
    userName.innerText = "👤 " + user.name;
    userName.style.display = "inline";
    logoutBtn.style.display = "inline";
    bookingNav.style.display = "inline-block";
    loginBtn.style.display = "none";
    registerBtn.style.display = "none";
  }
}

// ================= LOGOUT =================
function logout() {
  localStorage.removeItem("loggedInUser");
  localStorage.removeItem("admin");
  window.location.href = "index.html";
}

// ================= LOAD BOOKINGS =================

function formatDate(dateStr) {

  if (!dateStr) return "-";

  const date = new Date(dateStr);

  return date.toLocaleDateString("en-GB", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}

function formatTime(timeStr) {

  if (!timeStr) return "-";

  // already am/pm असेल तर direct return
  if (
    timeStr.toLowerCase().includes("am") ||
    timeStr.toLowerCase().includes("pm")
  ) {
    return timeStr;
  }

  const [hour, minute] = timeStr.split(":");

  let h = parseInt(hour);

  let ampm = h >= 12 ? "pm" : "am";

  h = h % 12;

  h = h ? h : 12;

  return `${h}:${minute} ${ampm}`;
}


function loadBookings(filter = "") {
  const user = JSON.parse(localStorage.getItem("loggedInUser"));

  if (!user) {
    alert("Please login first ❌");
    window.location.href = "index.html";
    return;
  }

  fetch("http://vishwpandhariyatrinivas.onrender.com/my-bookings/" + user.id)
    .then(res => {
      if (!res.ok) throw new Error("API not working ❌");
      return res.json();
    })
    .then(response => {
      console.log("API RESPONSE 👉", response);

      let bookings = response.data || response || [];

      const tbody = document.getElementById("bookingTableBody");
      tbody.innerHTML = "";

      if (!Array.isArray(bookings) || bookings.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="13">No bookings found 😢</td>
          </tr>
        `;
        return;
      }

      const filtered = bookings.filter(b =>
        (b.room_type || "").toLowerCase().includes(filter.toLowerCase())
      );

      filtered.forEach(b => {

  tbody.innerHTML += `
    <tr id="booking-${b.id}">
      <td>${b.id || "-"}</td>
      <td>${b.user_name || "-"}</td>
      <td>${b.email || "-"}</td>
      <td>${b.phone || "-"}</td>
      <td>${b.room_type || "-"}</td>
      <td>${b.room_id || "-"}</td>

      <td>
  ${formatDate(b.check_in)}<br>
  <small>${formatTime(b.check_in_time)}</small>
</td>

<td>
  ${formatDate(b.check_out)}<br>
  <small>${formatTime(b.check_out_time)}</small>
</td>

      <td>${b.guests || "-"}</td>

      <!-- ✅ PRICE DIRECT -->
      <td>₹${b.price ?? 0}</td>

      <td style="color: green; font-weight: bold;">
        ${b.status || "Confirmed"}
      </td>

      <td>${formatDateTime(b.created_at)}</td>

      <td>
        <button onclick="cancelBooking(${b.id})">❌</button>
        <button onclick="downloadPDF(${b.id})">📄</button>
      </td>
    </tr>
  `;
});
    })
    .catch(err => {
      console.error("ERROR 👉", err);

      document.getElementById("bookingTableBody").innerHTML =
        `<tr><td colspan="13">Error loading bookings ❌</td></tr>`;
    });
}


// ================= CANCEL =================
function cancelBooking(id) {
  if (!confirm("Are you sure to cancel booking? ❌")) return;

  fetch("http://vishwpandhariyatrinivas.onrender.com/cancel-booking/" + id, {
    method: "DELETE"
  })
    .then(res => res.json())
    .then(() => {
      alert("Booking Cancelled ❌");
      loadBookings();
    });
}

// ================= PDF =================
// ================= PDF =================

  const row = document.getElementById("booking-" + id);

  const cells = row.getElementsByTagName("td");

  const content = `
    <div style="
      padding:25px;
      font-family:Arial;
      border:2px solid #ff7a00;
      border-radius:12px;
      width:700px;
    ">

      <h1 style="
        text-align:center;
        color:#ff7a00;
        margin-bottom:5px;
      ">
        Vishwpandhari Yatrinivas
      </h1>

      <h2 style="
        text-align:center;
        margin-top:0;
        color:#444;
      ">
        Booking Receipt
      </h2>

      <hr>

      <table style="
        width:100%;
        border-collapse:collapse;
        margin-top:20px;
      ">

        <tr>
          <td><b>Booking ID</b></td>
          <td>${cells[0].innerText}</td>
        </tr>

        <tr>
          <td><b>Name</b></td>
          <td>${cells[1].innerText}</td>
        </tr>

        <tr>
          <td><b>Email</b></td>
          <td>${cells[2].innerText}</td>
        </tr>

        <tr>
          <td><b>Phone</b></td>
          <td>${cells[3].innerText}</td>
        </tr>

        <tr>
          <td><b>Room Type</b></td>
          <td>${cells[4].innerText}</td>
        </tr>

        <tr>
          <td><b>Room ID</b></td>
          <td>${cells[5].innerText}</td>
        </tr>

        <tr>
          <td><b>Check-In</b></td>
          <td>${cells[6].innerText}</td>
        </tr>

        <tr>
          <td><b>Check-Out</b></td>
          <td>${cells[7].innerText}</td>
        </tr>

        <tr>
          <td><b>Guests</b></td>
          <td>${cells[8].innerText}</td>
        </tr>

        <tr>
          <td><b>Total Price</b></td>
          <td>${cells[9].innerText}</td>
        </tr>

        <tr>
          <td><b>Status</b></td>
          <td>${cells[10].innerText}</td>
        </tr>

        <tr>
          <td><b>Booked On</b></td>
          <td>${cells[11].innerText}</td>
        </tr>

      </table>

      <br><br>

      <p style="
        text-align:center;
        color:gray;
        font-size:14px;
      ">
        Thank you for choosing Vishwpandhari Yatrinivas 🙏
      </p>

    </div>
  `;

  const element = document.createElement("div");

  element.innerHTML = content;

  html2pdf()
    .set({
      margin: 0.5,
      filename: "booking_" + id + ".pdf",
      image: { type: "jpeg", quality: 1 },
      html2canvas: { scale: 2 },
      jsPDF: {
        unit: "in",
        format: "a4",
        orientation: "portrait"
      }
    })
    .from(element)
    .save();
}

// ================= PAGE LOAD =================
window.addEventListener("load", function () {
  updateNavbar();
  loadBookings();
});

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
