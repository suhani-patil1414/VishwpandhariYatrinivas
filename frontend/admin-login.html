<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f2f2f2;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    input {
      display: block;
      margin: 10px auto;
      padding: 8px;
      width: 200px;
    }

    button {
      padding: 8px 15px;
      background: green;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Admin Login</h2>

  <input type="email" id="email" placeholder="Enter Email">
  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="adminLogin()">Login</button>
  <button onclick="logoutAdmin()">Logout</button>
</div>

<script>
function adminLogin() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  fetch("http://vishwpandhariyatrinivas.onrender.com/admin/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ email, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert("Login Success ✅");

      // save admin session
      localStorage.setItem("admin", "true");

      // redirect
      window.location.href = "admin-rooms.html";
    } else {
      alert(data.message);
    }
  });
}

function logoutAdmin() {
  localStorage.removeItem("admin");
  window.location.href = "admin-login.html";
}
</script>

</body>
</html>
